[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-twin-telemetry"
version = "1.0.0"
description = "Telemetry extraction engine for an EV Battery Swap Station Digital Twin"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
twin-telemetry = "telemetry.__main__:main"

[tool.setuptools]
packages = ["telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:telemetry.*"]
